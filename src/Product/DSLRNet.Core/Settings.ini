; Chaos loot: chance in percent of each rarity tier dropping, per game stage of the area.
; Common = rarity 0, Uncommon = 1-3, Rare = 4-6, Mythical = 7-9, Legendary = 10.
; Values are normalized if a stage does not add up to 100. 0 means that tier never drops.
[Settings.ItemLotGeneratorSettings.ChaosRarityChances.Early]
Common = 20
Uncommon = 55
Rare = 20
Mythical = 4.5
Legendary = 0.5

[Settings.ItemLotGeneratorSettings.ChaosRarityChances.Mid]
Common = 10
Uncommon = 47
Rare = 31
Mythical = 10
Legendary = 2

[Settings.ItemLotGeneratorSettings.ChaosRarityChances.Late]
